name: Scheduled Traffic & Event Feed Updater

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run feed generator
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
        run: python update_vegas_zones.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add vegas_events.json vegas_av_geofences.geojson
          if git diff --staged --quiet; then
            echo "No changes found."
          else
            git commit -m "chore(feed): auto-update Las Vegas exclusion zones [skip ci]"
            git push
          fi
